"$schema" = 'https://starship.rs/config-schema.json'

# [aws] has one style, so the profile is a custom module (red for production).
# $duration stays on [aws], which reads AWS_CREDENTIAL_EXPIRATION, then
# AWS_SESSION_EXPIRATION, then AWSUME_EXPIRATION. The () group is omitted when
# $duration is empty, so force_display prints nothing without an expiration.
# $aws precedes $custom in the default prompt, so the timer leads the profile.
# symbol is from `starship preset nerd-font-symbols`.
# format is from `starship preset bracketed-segments`.
# [aws] stays duration-only (profile is the custom modules below).

[aws]
symbol = " "
force_display = true
format = '(\[[$duration]($style)\] )'

