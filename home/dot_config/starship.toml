[custom.aws]
description = "AWS profile (non-production)"
shell = ["sh"]
when = '''
profile=${AWS_VAULT:-${AWS_PROFILE:-}}
[ -n "$profile" ] || exit 1
case "$profile" in
  *-prod|*production*|*cleardata*) exit 1 ;;
esac
'''
command = 'printf %s "${AWS_VAULT:-${AWS_PROFILE:-}}"'
style = "fg:black bg:green"
format = '\[[$output]($style)\] '

[custom.aws_prod]
description = "AWS profile (production)"
shell = ["sh"]
when = '''
profile=${AWS_VAULT:-${AWS_PROFILE:-}}
case "$profile" in
  *-prod|*production*|*cleardata*) exit 0 ;;
esac
exit 1
'''
command = 'printf %s "${AWS_VAULT:-${AWS_PROFILE:-}}"'
style = "fg:yellow bg:red"
format = '\[[$output]($style)\] '
