"$schema" = 'https://starship.rs/config-schema.json'

right_format = '$aws'

[aws]
format = '[$symbol $profile \($region\) (\[$duration\])]($style) '
style = 'bold red'
symbol = "AWS:"

[git_branch]
format = '\[[$symbol$branch]($style)\] '

[git_metrics]
disabled = false

[git_status]
format = '([\[$all_status$ahead_behind\]]($style)) '

[nodejs]
disabled = true

[package]
disabled = true

# uv does not activate .venv on cd, so python/python3 on PATH is Homebrew.
[python]
format = '\[[$symbol$version]($style)\] '
python_binary = [".venv/bin/python", "python", "python3"]

# Show the shell level in nested shells.
[shlvl]
disabled = false
threshold = 2
