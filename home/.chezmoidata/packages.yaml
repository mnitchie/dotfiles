# Homebrew's aws-vault formula tracks the maintained ByteNess fork.
# https://github.com/ByteNess/aws-vault
brews:
  - aws-vault
  - awscli
  - bat
  - cloc
  - duf
  - dust
  - eza
  - fd
  - fish
  - fnm
  - fzf
  - gh
  - git
  - git-delta
  - jq
  - nmap
  - pre-commit
  - ripgrep
  - starship
  - tree
  # The tldr formula is disabled. tlrc is the official client; the command is tldr.
  - tlrc
  - uv
  - vim
  - wget
  - zoxide
  - zsh-autosuggestions
  - zsh-syntax-highlighting

# Homebrew's llm formula is unreliable. Install with uv after brew bundle.
# `with` entries are `uv tool install --with` packages, kept across `uv tool upgrade`.
uvTools:
  - name: llm
    with:
      - llm-ollama

# darwin only. There is no 1password-cli formula. The cask's Linux build only
# links the op binary, so Linux uses 1Password's apt repository (WSL uses op.exe on Windows).
casks:
  - 1password-cli
  - font-jetbrains-mono-nerd-font

# Homebrew's Debian/Ubuntu requirements, plus the login shell.
# https://docs.brew.sh/Homebrew-on-Linux
apt:
  - build-essential
  - procps
  - curl
  - file
  - git
  - less
  - zsh

# Non-headless linux only. fontconfig provides fc-cache for the Nerd Font.
aptLinuxDesktop:
  - fontconfig
